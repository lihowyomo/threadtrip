<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>童話漫遊繪本 🍊 一鍵智慧生成版</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#FF7E36" />

  <style>
    :root {
      --primary: #FF7E36;
      --primary-deep: #E85B07;
      --primary-soft: #FFF2E6;
      --paper-bg: #FFFCF7;
      --paper-card: #FFFFFF;
      --border-color: #F7DFC7;
      --ink: #3B2F2F;
      --ink-muted: #7D6F69;
      --naver-green: #03C75A;
      --naver-bg: #E8F8EE;
      --google-blue: #4285F4;
      --google-bg: #EEF4FD;
      --app-bg-1: #FFF4E5;
      --app-bg-2: #F5E5D3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "微軟正黑體", sans-serif;
    }

    body {
      background: radial-gradient(circle at center, var(--app-bg-1) 0%, var(--app-bg-2) 100%);
      color: var(--ink);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      position: relative;
    }

    #effectCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 頂部導航列 */
    header {
      width: 100%;
      max-width: 440px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .nav-tab {
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--ink-muted);
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .nav-tab.active {
      background: var(--primary);
      color: #fff;
    }

    .action-icons {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* 視圖切換容器 */
    .view-container {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    .view-panel {
      display: none;
      width: 100%;
      height: 100%;
    }
    .view-panel.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 1. 繪本視圖樣式 */
    .storybook-wrapper {
      position: relative;
      width: min(92vw, 420px);
      height: min(78vh, 700px);
      perspective: 1800px;
    }

    .storybook {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      right: 0;
      background-color: var(--paper-bg);
      border-radius: 12px 24px 24px 12px;
      border: 3px solid var(--border-color);
      padding: 20px 16px 14px 20px;
      display: flex;
      flex-direction: column;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.25, 1, 0.35, 1);
      box-shadow: inset 18px 0 25px -12px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .page.flipped {
      transform: rotateY(-180deg);
      pointer-events: none;
    }

    .page-scroll {
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: 24px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .page-scroll::-webkit-scrollbar { display: none; }

    /* 封面特別樣式 */
    .cover-page {
      background: linear-gradient(150deg, var(--primary) 0%, var(--primary-deep) 100%);
      color: #FFFFFF;
      border: 3px solid var(--primary-deep);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      padding: 26px 18px;
      border-radius: 24px;
    }

    .cover-illu {
      font-size: 3.8rem;
      cursor: pointer;
      display: inline-block;
      margin: 6px 0;
    }

    .cover-title {
      font-size: 1.7rem;
      font-weight: 900;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    .trip-summary-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-top: 6px;
    }

    .cover-card {
      background: #FFFFFF;
      color: var(--ink);
      border-radius: 16px;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.8rem;
      line-height: 1.5;
      border: 2px dashed var(--border-color);
      max-height: 140px;
      overflow-y: auto;
    }

    .quick-paste-btn {
      background: #FFFFFF;
      color: var(--primary-deep);
      border: 2px solid #FFFFFF;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 8px 0;
    }

    .chapter-tag {
      display: inline-flex;
      background: var(--primary-soft);
      border: 1px solid var(--border-color);
      color: var(--primary-deep);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 14px;
      margin-bottom: 4px;
    }

    .chapter-header {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hotel-banner {
      background: var(--primary-soft);
      border: 1px solid var(--border-color);
      color: var(--primary-deep);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timeline-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .story-card {
      background: var(--paper-card);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 9px 12px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .story-card.completed {
      border-color: #8FD19E;
      background: #F8FFF9;
    }
    .story-card.completed::after {
      content: "✓ 完成";
      position: absolute;
      right: 10px;
      bottom: 8px;
      background: rgba(62, 126, 67, 0.12);
      color: #2F6B38;
      border: 1px dashed #2F6B38;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      transform: rotate(-6deg);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .badge-time {
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--primary-soft);
      color: var(--primary-deep);
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .card-headline {
      font-size: 0.86rem;
      font-weight: 800;
      margin-left: 4px;
      flex: 1;
    }

    .map-tag-group {
      display: flex;
      gap: 4px;
    }

    .map-btn {
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 0.65rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .map-btn.naver {
      background: var(--naver-bg);
      color: var(--naver-green);
      border: 1px solid #B8E8C7;
    }
    .map-btn.google {
      background: var(--google-bg);
      color: var(--google-blue);
      border: 1px solid #C2D7FB;
    }

    .card-text {
      font-size: 0.76rem;
      color: var(--ink-muted);
      line-height: 1.45;
      margin-top: 4px;
    }

    .page-tail {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      font-size: 0.7rem;
      color: var(--ink-muted);
      border-top: 1px dashed var(--border-color);
    }

    .book-controls {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .action-btn {
      background: #FFFFFF;
      color: var(--primary-deep);
      border: 2px solid var(--primary);
      padding: 7px 16px;
      border-radius: 25px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }
    .action-btn:disabled {
      opacity: 0.35;
      pointer-events: none;
      border-color: #D6C5B8;
      color: #9C8F84;
    }
